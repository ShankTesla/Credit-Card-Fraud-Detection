[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_card_fraud_detection"
version = "0.0.1"
description = "Kaggle's Credit Card Fraud Detection"
authors = [
  { name = "Gowri Shankar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["credit_card_fraud_detection"]
include = ["pyproject.toml", "credit_card_fraud_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_card_fraud_detection"]
force-sort-within-sections = true

